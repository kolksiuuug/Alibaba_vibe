# Параметры скоринга и кредитного решения. Описание и формулы — docs/scoring.md.
# Суммы в рублях, сроки в месяцах, ставки в процентах годовых.
# bands: [порог, баллы]. Для «нижних границ» берётся последняя полоса, порог которой <= значения;
# для «верхних границ» — первая полоса, порог которой >= значения (null — без ограничения).

stop_factors:
  inactive_company_statuses: [liquidating, liquidated, bankrupt]
  max_current_overdue_days: 90     # текущая просрочка больше порога -> отказ
  max_tax_debt: 100000             # налоговая задолженность больше порога -> отказ
  min_business_age_months: 6

factors:
  business_age:                    # возраст бизнеса, мес.; нижние границы
    max_points: 40
    bands: [[0, 0], [12, 10], [24, 20], [36, 30], [60, 40]]
  avg_turnover:                    # среднемесячный оборот, руб.; нижние границы
    max_points: 50
    bands: [[0, 0], [300000, 10], [1000000, 25], [3000000, 40], [10000000, 50]]
  turnover_stability:              # коэффициент вариации оборотов; верхние границы
    max_points: 40
    bands: [[0.10, 40], [0.20, 30], [0.35, 15], [0.50, 5], [null, 0]]
  debt_load:                       # платежи по текущим кредитам / среднемесячный оборот; верхние границы
    max_points: 40
    bands: [[0.05, 40], [0.15, 30], [0.30, 15], [0.45, 0], [null, -20]]
  credit_history:                  # БКИ, последние 24 месяца
    max_points: 50
    clean: 50                      # просрочек не было
    minor: 30                      # максимум до minor_max_days и не больше minor_max_count случаев
    moderate: 10                   # максимум до moderate_max_days
    severe: -20                    # просрочки дольше или текущая просрочка
    minor_max_days: 30
    minor_max_count: 2
    moderate_max_days: 60
  tax_discipline:                  # ФНС: опоздания с уплатой налогов за 12 месяцев; верхние границы
    max_points: 30
    bands: [[0, 30], [2, 15], [null, 0]]
    debt_penalty: -10              # есть задолженность ниже порога стоп-фактора
  amount_to_turnover:              # запрошенная сумма / годовой оборот; верхние границы
    max_points: 30
    bands: [[0.10, 30], [0.25, 20], [0.50, 5], [null, -15]]
  security:                        # залог или поручительство
    max_points: 30
    collateral: 25
    guarantee: 15
    both: 30
  industry_risk:                   # отраслевой риск по классу ОКВЭД (первые две цифры кода)
    max_points: 20
    low_points: 20
    default_points: 10
    high_points: 0
    low_classes: ["10", "11", "13", "14", "16", "22", "25", "26", "27", "28", "29", "31",
                  "46", "47", "62", "63", "69", "70", "71", "72", "85", "86"]
    high_classes: ["41", "42", "43", "55", "56", "68", "77", "92", "93"]

grades:                            # минимальная сумма баллов для грейда; максимум 330, ниже D — E
  A: 250
  B: 200
  C: 140
  D: 100

decision:
  max_debt_load: 0.25              # (текущие платежи + новый платёж) / среднемесячный оборот
  limit_multiplier: {A: 3.0, B: 2.0, C: 1.5, D: 1.0}   # k(грейд) в формуле лимита
  term_factor_cap_months: 36       # f(срок) = min(срок, 36) / 12
  rate_premium: {A: 0.0, B: 1.5, C: 3.0, D: 5.0}       # надбавка к ставке за грейд, п. п.
  d_grade_amount_share: 0.5        # грейд D: контрпредложение не больше этой доли от запрошенной суммы
  amount_rounding: 10000           # лимит и контрпредложение округляются вниз до шага
