      summary: "\u0421\u0435\u0440\u0432\u0438\u0441 \u0433\u043E\u0442\u043E\u0432\
        \ \u043F\u0440\u0438\u043D\u0438\u043C\u0430\u0442\u044C \u0437\u0430\u043F\
        \u0440\u043E\u0441\u044B: \u0431\u0430\u0437\u0430 \u0434\u0430\u043D\u043D\
        \u044B\u0445 \u0434\u043E\u0441\u0442\u0443\u043F\u043D\u0430."
      tags:
      - health
tags:
- description: "\u0421\u043E\u0441\u0442\u043E\u044F\u043D\u0438\u0435 \u0441\u0435\
