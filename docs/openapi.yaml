openapi: 3.0.3
info:
  title: Умный кредитный кабинет предпринимателя
  version: 1.0.0
tags:
- name: health
  description: Состояние сервиса
- name: auth
  description: Демо-вход и профиль
- name: products
  description: Продукты и калькулятор
- name: applications
  description: Заявки клиента
- name: notifications
  description: Уведомления
- name: analyst
  description: Аналитик
security:
- bearerAuth: []
paths:
  /api/health:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      summary: Процесс жив (зависимости не проверяются).
      tags:
      - health
      security: []
  /api/ready:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      summary: 'Сервис готов принимать запросы: база данных доступна.'
      tags:
      - health
      security: []
  /api/v1/auth/demo-profiles:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DemoProfile'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      summary: 'Демо-профили для экрана входа: пять компаний и аналитик.'
      tags:
      - auth
      security: []
  /api/v1/auth/demo-login:
    post:
      responses:
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_ENTITY'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoLogin'
      summary: Войти в демо-профиль и получить Bearer-токен.
      tags:
      - auth
      security: []
  /api/v1/me:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      summary: Текущий пользователь и его компания.
      tags:
      - auth
  /api/v1/products:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      summary: Кредитные продукты со ставкой «от».
      tags:
      - products
  /api/v1/products/recommend:
    post:
      responses:
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_ENTITY'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Recommendation'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendRequest'
      summary: 1–3 подходящих продукта с предварительной ставкой и ежемесячным платежом.
      tags:
      - products
  /api/v1/calculator:
    post:
      responses:
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_ENTITY'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculatorResponse'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculatorRequest'
      summary: Аннуитетный платёж и график. Ставка — annual_rate или ставка «от» продукта.
      tags:
      - products
  /api/v1/applications:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApplicationSummary'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      summary: Заявки компании текущего клиента.
      tags:
      - applications
    post:
      responses:
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_ENTITY'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDetail'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationCreate'
      summary: Создать черновик. Данные компании подставляются автоматически.
      tags:
      - applications
  /api/v1/applications/{application_id}:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDetail'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      summary: 'Карточка заявки: статус, этапы проверки, предложение, дозапрос, факторы
        решения.'
      tags:
      - applications
    patch:
      responses:
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_ENTITY'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDetail'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationPatch'
      summary: Изменить черновик (условия и поля анкеты).
      tags:
      - applications
    parameters:
    - in: path
      name: application_id
      required: true
      schema:
        type: integer
        minimum: 0
  /api/v1/applications/{application_id}/submit:
    post:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDetail'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      summary: Отправить заявку на проверку. Повтор идемпотентен.
      tags:
      - applications
    parameters:
    - in: path
      name: application_id
      required: true
      schema:
        type: integer
        minimum: 0
  /api/v1/applications/{application_id}/cancel:
    post:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDetail'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      summary: Отменить черновик или заявку, по которой банк ждёт ответа.
      tags:
      - applications
    parameters:
    - in: path
      name: application_id
      required: true
      schema:
        type: integer
        minimum: 0
  /api/v1/applications/{application_id}/info-response:
    post:
      responses:
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_ENTITY'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDetail'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InfoResponse'
      summary: 'Ответить на дозапрос банка: заявка снова уходит на проверку.'
      tags:
      - applications
    parameters:
    - in: path
      name: application_id
      required: true
      schema:
        type: integer
        minimum: 0
  /api/v1/applications/{application_id}/offer/accept:
    post:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDetail'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      summary: Принять предложение банка.
      tags:
      - applications
    parameters:
    - in: path
      name: application_id
      required: true
      schema:
        type: integer
        minimum: 0
  /api/v1/applications/{application_id}/offer/decline:
    post:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDetail'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      summary: Отклонить предложение банка.
      tags:
      - applications
    parameters:
    - in: path
      name: application_id
      required: true
      schema:
        type: integer
        minimum: 0
  /api/v1/applications/{application_id}/sign/request-code:
    post:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignCode'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      summary: 'Получить код подписи. Симуляция: код показывается в интерфейсе, SMS
        не отправляется.'
      tags:
      - applications
    parameters:
    - in: path
      name: application_id
      required: true
      schema:
        type: integer
        minimum: 0
  /api/v1/applications/{application_id}/sign/confirm:
    post:
      responses:
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_ENTITY'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDetail'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignConfirm'
      summary: Подписать договор кодом (симуляция ЭП). Дальше воркер выдаёт кредит.
      tags:
      - applications
    parameters:
    - in: path
      name: application_id
      required: true
      schema:
        type: integer
        minimum: 0
  /api/v1/applications/{application_id}/events:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      summary: Таймлайн переходов статуса.
      tags:
      - applications
    parameters:
    - in: path
      name: application_id
      required: true
      schema:
        type: integer
        minimum: 0
  /api/v1/notifications:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      summary: Последние уведомления пользователя и число непрочитанных.
      tags:
      - notifications
  /api/v1/notifications/{notification_id}/read:
    post:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      summary: Отметить уведомление прочитанным.
      tags:
      - notifications
    parameters:
    - in: path
      name: notification_id
      required: true
      schema:
        type: integer
        minimum: 0
  /api/v1/analyst/applications:
    get:
      parameters:
      - in: query
        name: status
        description: draft | submitted | checking | info_requested | manual_review
          | offer | accepted | signed | issued | rejected | declined | cancelled
        schema:
          type: string
          default: null
          nullable: true
        required: false
      responses:
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_ENTITY'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QueueItem'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      summary: Очередь заявок с фильтром по статусу (черновики не показываются).
      tags:
      - analyst
  /api/v1/analyst/applications/{application_id}:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalystCard'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      summary: 'Карточка: данные, проверки, скоринг по факторам, рекомендация движка,
        журнал.'
      tags:
      - analyst
    parameters:
    - in: path
      name: application_id
      required: true
      schema:
        type: integer
        minimum: 0
  /api/v1/analyst/applications/{application_id}/decision:
    post:
      responses:
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_ENTITY'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalystCard'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalystDecision'
      summary: 'Решение по ручному рассмотрению: одобрить, изменить условия, дозапрос,
        отказ.'
      tags:
      - analyst
    parameters:
    - in: path
      name: application_id
      required: true
      schema:
        type: integer
        minimum: 0
components:
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          description: URI типа ошибки, по умолчанию about:blank
        title:
          type: string
          description: Краткое описание на русском
        status:
          type: integer
          description: HTTP-статус
        detail:
          type: string
          description: Подробности для пользователя
        instance:
          type: string
          description: Путь запроса
        code:
          type: string
          description: Машинный код ошибки
        errors:
          type: object
          description: Ошибки валидации по полям
          additionalProperties: {}
        request_id:
          type: string
          description: Идентификатор запроса для поиска в логах
    PaginationMetadata:
      type: object
      properties:
        total:
          type: integer
          description: Total number of items.
        total_pages:
          type: integer
          description: Total number of pages.
        first_page:
          type: integer
          description: First available page number.
        last_page:
          type: integer
          description: Last available page number.
        page:
          type: integer
          description: Current page number.
        previous_page:
          type: integer
          description: Previous page number.
        next_page:
          type: integer
          description: Next page number.
    Health:
      type: object
      properties:
        status:
          type: string
          example: ok
      required:
      - status
    DemoProfile:
      type: object
      properties:
        login:
          type: string
        role:
          type: string
        display_name:
          type: string
        demo_hint:
          type: string
          nullable: true
        company_name:
          type: string
          nullable: true
      required:
      - display_name
      - login
      - role
    DemoLogin:
      type: object
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 64
      required:
      - login
    TurnoverMonth:
      type: object
      properties:
        month:
          type: string
          example: 2026-09
        amount:
          type: integer
      required:
      - amount
      - month
    Company:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        kind:
          type: string
          description: ip | llc
        inn:
          type: string
        ogrn:
          type: string
        okved:
          type: string
        okved_name:
          type: string
        registered_at:
          type: string
          format: date
        region:
          type: string
        director_name:
          type: string
        monthly_turnover:
          type: array
          items:
            $ref: '#/components/schemas/TurnoverMonth'
      required:
      - director_name
      - id
      - inn
      - kind
      - monthly_turnover
      - name
      - ogrn
      - okved
      - okved_name
      - region
      - registered_at
    User:
      type: object
      properties:
        id:
          type: integer
        login:
          type: string
        role:
          type: string
          description: client | analyst
        display_name:
          type: string
        demo_hint:
          type: string
          nullable: true
        company:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/Company'
      required:
      - display_name
      - id
      - login
      - role
    Token:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'
      required:
      - token
      - user
    LabelledField:
      type: object
      properties:
        code:
          type: string
        label:
          type: string
      required:
      - code
      - label
    Product:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        description:
          type: string
        purposes:
          type: array
          items:
            type: string
        min_amount:
          type: integer
        max_amount:
          type: integer
        min_term_months:
          type: integer
        max_term_months:
          type: integer
        rate_spread:
          type: number
        base_rate:
          type: number
          description: 'Ставка «от»: ключевая ставка + спред продукта'
        requires_collateral:
          type: boolean
        requires_guarantee:
          type: boolean
        required_fields:
          type: array
          items:
            $ref: '#/components/schemas/LabelledField'
      required:
      - base_rate
      - code
      - description
      - max_amount
      - max_term_months
      - min_amount
      - min_term_months
      - name
      - purposes
      - rate_spread
      - required_fields
      - requires_collateral
      - requires_guarantee
    RecommendRequest:
      type: object
      properties:
        purpose:
          type: string
          enum:
          - working_capital
          - equipment
          - cash_gap
          - expansion
        amount:
          type: integer
          minimum: 1
        term_months:
          type: integer
          minimum: 1
          maximum: 120
      required:
      - amount
      - purpose
      - term_months
    Recommendation:
      type: object
      properties:
        product:
          $ref: '#/components/schemas/Product'
        amount:
          type: integer
        term_months:
          type: integer
        rate:
          type: number
        monthly_payment:
          type: number
        fits:
          type: boolean
          description: Сумма и срок подходят продукту
        notes:
          type: array
          items:
            type: string
      required:
      - amount
      - fits
      - monthly_payment
      - notes
      - product
      - rate
      - term_months
    CalculatorRequest:
      type: object
      properties:
        amount:
          type: integer
          minimum: 1
        term_months:
          type: integer
          minimum: 1
          maximum: 120
        product_code:
          type: string
        annual_rate:
          type: number
          minimum: 0.0
          maximum: 100.0
      required:
      - amount
      - term_months
    ScheduleRow:
      type: object
      properties:
        number:
          type: integer
        payment:
          type: number
        principal:
          type: number
        interest:
          type: number
        balance:
          type: number
      required:
      - balance
      - interest
      - number
      - payment
      - principal
    CalculatorResponse:
      type: object
      properties:
        amount:
          type: integer
        term_months:
          type: integer
        annual_rate:
          type: number
        monthly_payment:
          type: number
        total_payment:
          type: number
        overpayment:
          type: number
        schedule:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleRow'
      required:
      - amount
      - annual_rate
      - monthly_payment
      - overpayment
      - schedule
      - term_months
      - total_payment
    ProductBrief:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        requires_collateral:
          type: boolean
        requires_guarantee:
          type: boolean
      required:
      - code
      - name
      - requires_collateral
      - requires_guarantee
    ApplicationSummary:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
          description: draft | submitted | checking | info_requested | manual_review
            | offer | accepted | signed | issued | rejected | declined | cancelled
        product:
          $ref: '#/components/schemas/ProductBrief'
        amount:
          type: integer
        term_months:
          type: integer
        purpose:
          type: string
        created_at:
          type: string
          format: date-time
        status_changed_at:
          type: string
          format: date-time
      required:
      - amount
      - created_at
      - id
      - product
      - purpose
      - status
      - status_changed_at
      - term_months
    ApplicationCreate:
      type: object
      properties:
        product_code:
          type: string
        amount:
          type: integer
          minimum: 1
        term_months:
          type: integer
          minimum: 1
          maximum: 120
        purpose:
          type: string
          enum:
          - working_capital
          - equipment
          - cash_gap
          - expansion
        form_data:
          type: object
          additionalProperties: {}
      required:
      - amount
      - product_code
      - purpose
      - term_months
    Step:
      type: object
      properties:
        code:
          type: string
        title:
          type: string
        state:
          type: string
          description: pending | running | done | failed
        started_at:
          type: string
        finished_at:
          type: string
        message:
          type: string
      required:
      - code
      - state
    Application:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
          description: draft | submitted | checking | info_requested | manual_review
            | offer | accepted | signed | issued | rejected | declined | cancelled
        product:
          $ref: '#/components/schemas/ProductBrief'
        amount:
          type: integer
        term_months:
          type: integer
        purpose:
          type: string
        created_at:
          type: string
          format: date-time
        status_changed_at:
          type: string
          format: date-time
        company:
          $ref: '#/components/schemas/Company'
        form_data:
          type: object
          additionalProperties: {}
        pipeline_steps:
          type: array
          items:
            $ref: '#/components/schemas/Step'
        submitted_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
      required:
      - amount
      - company
      - created_at
      - form_data
      - id
      - pipeline_steps
      - product
      - purpose
      - status
      - status_changed_at
      - term_months
      - updated_at
    Completeness:
      type: object
      properties:
        ready_to_submit:
          type: boolean
        missing_required:
          type: array
          items:
            $ref: '#/components/schemas/LabelledField'
        missing_for_product:
          type: array
          items:
